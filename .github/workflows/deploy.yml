name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Instalar dependências nativas da plataforma
        run: |
          # O lockfile gerado no macOS pode omitir os bindings do Linux.
          # Recria o lock sem node_modules antes da instalação no runner.
          rm -rf node_modules
          rm -f package-lock.json
          npm install --package-lock-only --include=optional
          npm ci --include=optional
      - name: Verificar carregamento dos bindings nativos
        run: node --input-type=module -e "await import('rolldown'); await import('@tailwindcss/oxide');"
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
